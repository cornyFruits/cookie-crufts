<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Keeps Google from listing this page. It's also not linked from your menu. -->
  <meta name="robots" content="noindex, nofollow">

  <title>Yunay's Work</title>

  <!-- Fonts: Unkempt for headings and buttons, Monserrat for body text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Unkempt:wght@400;700&display=swap">
  <style>
    /* ==========================================================
       1. COLOURS
       Change a colour here and it changes everywhere.
       Each subject has its own colour (used on the left edge of
       its card, the tick box, and the section headings).
       ========================================================== */
    :root {
      --ink: #1d2340;        /* dark navy: text, borders, header */
      --paper: #f4f8ff;      /* page background */
      --card: #ffffff;       /* card background */
      --line: #d9e2f5;       /* soft borders and empty progress track */

      --history: #8F2D56;
      --science: #76BED0;
      --maths: #788C59;
      --english: #FCBF49;
      --geo: #57467B;        
      --activity: #E16036;
      --play: #61210F;     
      --review: #C23681;

      --fm: #FCBF49;         /* ft button */
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 400 15px/1.55 Montserrat, system-ui, sans-serif;
    }

    /* ==========================================================
       2. HEADER
       Navy block with two decorative circles (pink and yellow).
       ========================================================== */
    header {
      background: var(--ink);
      color: #fff;
      padding: 28px 20px 60px;
      position: relative;
      overflow: hidden;
    }

    /* keeps header text above the circles */
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    h1 {
      font: 700 clamp(2.2rem, 8vw, 3.6rem)/1 Unkempt, sans-serif;
      margin: 0 0 8px;
    }

    .hello {
      margin: 0;
      font-size: 1.1rem;
      opacity: .9;
    }

    /* the "your name" field, styled to look like it's part of the sentence */
    .hello input {
      font: inherit;
      font-weight: 800;
      color: var(--fm);
      background: none;
      border: 0;
      border-bottom: 2px dashed var(--fm);
      width: 9ch;
      padding: 0 2px;
    }

    /* main content slides up over the header slightly */
    main {
      max-width: 760px;
      margin: -34px auto 60px;
      padding: 0 14px;
      position: relative;
      z-index: 2;
    }

    /* ==========================================================
       3. DAY TABS (Mon to Fri)
       ========================================================== */
    nav {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      overflow-x: auto;           /* scrolls sideways on tiny screens */
      padding: 2px 2px 6px;
    }

    nav button {
      flex: 1;
      min-width: 64px;
      font: 600 1rem Unkempt, sans-serif;
      padding: 10px 6px;
      border-radius: 14px;
      border: 2px solid var(--ink);
      background: var(--card);
      color: var(--ink);
      cursor: pointer;
    }

    nav button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    /* the currently selected day */
    nav button[aria-selected=true] {
      background: var(--ink);
      color: #fff;
      border-color: var(--fm);
    }

    /* the little "2/4" under each day name */
    nav small {
      display: block;
      font: 600 .72rem Montserrat;
      opacity: .7;
    }

    /* ==========================================================
       4. DAY PROGRESS BAR
       ========================================================== */
    .bar {
      background: var(--card);
      border-radius: 20px;
      padding: 14px 16px;
      border: 2px solid var(--ink);
      box-shadow: 5px 5px 0 var(--ink);   /* the chunky offset shadow */
      margin-bottom: 18px;
    }

    .bar h2 {
      font: 600 1.4rem Unkempt, sans-serif;
      margin: 0;
    }

    .bar p {
      margin: 0;
      font-weight: 800;
    }

    .track {
      height: 16px;
      background: var(--line);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 8px;
    }

    /* width is set by JavaScript (progress function) */
    .fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #FCBF49, #C23681);
      border-radius: 99px;
      transition: width .5s;
    }

    /* ==========================================================
       5. SUBJECT DRAWERS
       Each subject is a card. --c is the card's accent colour,
       and it's swapped depending on data-s (the subject).
       ========================================================== */
    .task {
      --c: var(--english);          /* default colour */
      background: var(--card);
      border: 2px solid var(--ink);
      border-left: 12px solid var(--c);
      border-radius: 18px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    /* per-subject colours */
    .task[data-s=maths]     { --c: var(--maths); }
    .task[data-s=science]   { --c: var(--science); }
    .task[data-s=history]   { --c: var(--history); }
    .task[data-s=geography] { --c: var(--geo); }
    .task[data-s=activity]  { --c: var(--activity); }
    .task[data-s=play]    { --c: var(--play); }
    .task[data-s=review]    { --c: var(--review); }

    /* the always-visible top row: tick box + subject name */
    .hd {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
    }

    /* the button you click to open or close the drawer */
    .tg {
      flex: 1;
      text-align: left;
      background: none;
      border: 0;
      font: inherit;
      color: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }

    /* the little arrow on the right (a rotated square corner) */
    .tg:after {
      content: "";
      margin-left: auto;
      width: 10px;
      height: 10px;
      border: solid var(--ink);
      border-width: 0 3px 3px 0;
      transform: rotate(45deg);
      transition: transform .25s;
    }

    /* arrow flips when the drawer is open */
    .task.open .tg:after {
      transform: rotate(-135deg);
    }

    .name {                          /* "English", "Maths"... */
      font: 600 1.35rem Unkempt, sans-serif;
    }

    .sub {                           /* task title, e.g. "Gratitude list" */
      font-size: .95rem;
      opacity: .75;
    }

    /* crossed-out name once the subject is ticked off */
    .task.done .name {
      text-decoration: line-through;
      text-decoration-thickness: 3px;
    }

    /* ==========================================================
       6. TICK BOXES
       .tick = the big one on the subject
       .ck   = the smaller ones in checklists
       ========================================================== */
    .tick,
    .ck {
      appearance: none;              /* removes the browser's default checkbox */
      flex: none;
      width: 34px;
      height: 34px;
      border: 3px solid var(--ink);
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      display: grid;
      place-content: center;
      margin: 0;
    }

    .ck {
      width: 26px;
      height: 26px;
      border-width: 2px;
      border-radius: 8px;
    }

    /* filled with the subject colour when ticked */
    .tick:checked,
    .ck:checked {
      background: var(--c);
    }

    /* the white tick mark */
    .tick:checked:after,
    .ck:checked:after {
      content: "\2713";
      color: #fff;
      font: 700 22px/1 Unkempt;
    }

    .ck:checked:after {
      font-size: 17px;
    }

    /* visible outline for keyboard users */
    .tick:focus-visible,
    .ck:focus-visible,
    button:focus-visible,
    textarea:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--maths);
      outline-offset: 2px;
    }

    /* yellow "FaceTime me" badge */
    .tag {
      font: 600 .85rem Unkempt;
      background: var(--fm);
      color: var(--ink);
      border-radius: 99px;
      padding: 1px 10px;
    }

    /* ==========================================================
       7. INSIDE A DRAWER
       ========================================================== */
    .body {
      padding: 2px 18px 18px 18px;
      border-top: 2px dashed var(--line);
    }

    /* each labelled section: intro, context, activity, etc. */
    .sec {
      margin-top: 14px;
    }

    .sec h4 {                        /* section label, in the subject colour */
      font: 600 1.15rem Unkempt, sans-serif;
      color: var(--c);
      margin: 0 0 3px;
      filter: brightness(.8);        /* darkens it a touch so it's readable */
    }

    .sec p {
      margin: 0;
    }

    .words {                         /* spelling list */
      font-weight: 800;
      letter-spacing: .02em;
    }

    /* checklist rows */
    .items label {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 4px 0;
      cursor: pointer;
    }

    /* yellow buttons: worksheet download + send button */
    .dl,
    .send button {
      font: 600 1rem Unkempt;
      background: var(--fm);
      color: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 12px;
      padding: 8px 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    /* normal links (e.g. the reading link) */
    .sec a:not(.dl) {
      color: var(--maths);
      font-weight: 800;
    }

    /* answer boxes */
    textarea {
      width: 100%;
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      font: inherit;
      resize: vertical;
      background: #fbfcff;
    }

    textarea:focus {
      border-color: var(--c);        /* border takes the subject colour */
    }

    /* subtitle under the day title */
  .daysub {
    font: 400 1rem Unkempt, sans-serif;
    opacity: .85;
    margin: 4px 0 8px;
  }
  
  .daysub:empty { display: none; }

  /* word of the day */
  #wotd:not(:empty) {
    background: var(--fm);
    border: 2px solid var(--ink);
    border-radius: 18px;
    padding: 14px 18px;
    margin-bottom: 18px;
  }

  #wotd small {
    font: 600 .85rem Unkempt, sans-serif;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  #wotd h3 {
    font: 700 1.6rem Unkempt, sans-serif;
    margin: 2px 0;
  }
  #wotd p { margin: 4px 0 0; }

    /* ==========================================================
       8. "SEND ME YOUR WORK" BLOCK
       ========================================================== */
    .send {
      background: var(--ink);
      color: #fff;
      border-radius: 20px;
      padding: 16px;
      margin-top: 22px;
    }

    .send h3 {
      font: 600 1.2rem Unkempt;
      margin: 0 0 4px;
    }

    .send p {
      margin: 0 0 12px;
      opacity: .85;
    }

    /* respect people who've turned animations off on their device */
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>

      history: "History",
      geography: "Geography",
      activity: "Activity",
      play: "Play", 
      review: "Review",
    };

    /* S holds everything the child has done, saved on their device:
         name  their name
         done  which subjects are ticked
         ck    which checklist items are ticked
         ans   what they've typed in each answer box          */
    let S = { name: "", done: {}, ck: {}, ans: {} };

    let cur = 0;     // index of the selected day (0 = Monday)
    let open = -1;   // index of the open drawer (-1 = none)

    // Load saved progress. The try/catch means the page still works
    // if the browser blocks storage (e.g. private browsing).
    try {
      S = Object.assign(S, JSON.parse(localStorage.getItem(STORE) || "{}"));
    } catch (e) {}

    // Save progress
    const save = () => {
      try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {}
    };

    // Shortcut for document.getElementById
    const $ = (id) => document.getElementById(id);

    // Makes text safe to put inside HTML (stops stray < > " breaking the page)
    const esc = (s) =>
      String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    // Builds the unique save-key for a subject, e.g. day 2, subject 1 -> "2.1"
    const key = (dayIndex, subjectIndex) => dayIndex + "." + subjectIndex;

    // How many subjects are ticked on a given day
    const count = (dayIndex) =>
      DAYS[dayIndex].tasks.filter((t, i) => S.done[key(dayIndex, i)]).length;

      // Day 0 (Monday) unlocks on START, day 1 the next morning, and so on.
      const START = "2026-11-09";   // the Monday of this week, as YYYY-MM-DD

      const isUnlocked = (i) => {
        const [y, m, d] = START.split("-").map(Number);
        const unlockAt = new Date(y, m - 1, d + i);   // midnight, device time
        return new Date() >= unlockAt;
      };

    // Wraps content in a labelled section inside a drawer
    const sec = (heading, content) =>
      `<div class="sec"><h4>${heading}</h4>${content}</div>`;

    /* ---------- progress(): updates the bar and the day tabs ---------- */
    function progress() {
      const day = DAYS[cur];
      const done = count(cur);
      const total = day.tasks.length;

      $("dayTitle").textContent = day.n + ": " + day.t;
      $("dayCount").textContent = done == total ? "All done! Proud of ya." : done + " of " + total + " completed";
      $("daySub").innerHTML = day.sub || "";

      const w = day.wotd;
      $("wotd").innerHTML = w
        ? `<small>Word of the day</small>
          <h3>${w.w} <span style="font-weight:400;font-size:1rem">(${w.pos}) · ${w.say}</span></h3>
          <p>${w.def}</p>
          <p><em>${w.ex}</em></p>`
        : "";

      $("fill").style.width = Math.round((done / total) * 100) + "%";

      // Rebuild the tabs so each shows its own "2/4" count
      $("tabs").innerHTML = DAYS.map((d, i) =>
        `<button role="tab" aria-selected="${i == cur}" data-i="${i}" ${isUnlocked(i) ? "" : "disabled"}>
          ${d.d}<small>${isUnlocked(i) ? count(i) + "/" + d.tasks.length : "locked"}</small>
        </button>`
      ).join("");
    }

    /* ---------- render(): draws the subject drawers for the selected day ---------- */
    function render() {
      open = -1;

      $("tasks").innerHTML = DAYS[cur].tasks.map((t, si) => {
        const k = key(cur, si);
        let body = "";

        // Build each section, but only if the task has that field.
        // The order here is the order they appear in the drawer.
        if (t.i) body += sec("What", `<p>${t.i}</p>`);

        if (t.c || t.l) {
          body += sec("Context",
            (t.c ? `<p>${t.c}</p>` : "") +
            (t.l ? `<p><a href="${t.l[0]}" target="_blank" rel="noopener">${t.l[1]}</a></p>` : "")
          );
        }

        if (t.a) body += sec("Activity", `<p>${t.a}</p>`);

        if (t.sp) body += sec("Spelling words", `<p class="words">${t.sp}</p>`);

        if (t.ck) {
          body += sec(t.ckh || "Checklist",
            `<div class="items">` +
            t.ck.map((item, j) =>
              `<label><input type="checkbox" class="ck" data-k="${k}" data-j="${j}" ${S.ck[k + ".c" + j] ? "checked" : ""}>${item}</label>`
            ).join("") +
            `</div>`
          );
        }

        if (t.ws) body += sec("Worksheet", `<a class="dl" href="${t.ws}" download>Download the worksheet</a>`);

        // One textarea per answer box, each with its own label and saved text
        (t.bx || []).forEach((box, j) => {
          body += sec(box[0],
            `<textarea rows="${box[1]}" data-a="${k}.b${j}" placeholder="${esc(box[2] || "Type here")}" aria-label="${esc(box[0])}">${esc(S.ans[k + ".b" + j] || "")}</textarea>`
          );
        });

        // The full drawer: tick box + title row, then the (hidden) body
        return `
          <article class="task${S.done[k] ? " done" : ""}" data-s="${t.s}" data-si="${si}">
            <div class="hd">
              <input type="checkbox" class="tick" data-k="${k}" ${S.done[k] ? "checked" : ""} aria-label="${SUB[t.s]} done">
              <button class="tg" aria-expanded="false">
                <span class="name">${SUB[t.s]}</span>
                <span class="sub">${t.h}</span>
                ${t.fm ? '<span class="tag">FaceTime me</span>' : ""}
              </button>
            </div>
            <div class="body" hidden>${body}</div>
          </article>`;
      }).join("");

      progress();
    }

    /* ---------- EVENTS ---------- */

    // Clicking a day tab: switch day and redraw
    $("tabs").onclick = (e) => {
      const b = e.target.closest("button");
      if (b) {
        cur = +b.dataset.i;
        render();
      }
    };

    // Clicking a subject title: open it and close all the others.
    // Clicking the one that's already open just closes it.
    $("tasks").onclick = (e) => {
      const toggle = e.target.closest(".tg");
      if (!toggle) return;

      const card = toggle.closest(".task");
      const si = +card.dataset.si;
      const wasOpen = open == si;

      // close everything
      document.querySelectorAll(".task").forEach((x) => {
        x.classList.remove("open");
        x.querySelector(".body").hidden = true;
        x.querySelector(".tg").setAttribute("aria-expanded", "false");
      });
      open = -1;

      // reopen this one (unless it was the one being closed)
      if (!wasOpen) {
        card.classList.add("open");
        card.querySelector(".body").hidden = false;
        toggle.setAttribute("aria-expanded", "true");
        open = si;
      }
    };

    // Ticking any box (subject tick or checklist item)
    $("tasks").onchange = (e) => {
      const box = e.target;
      const card = box.closest(".task");

      if (box.classList.contains("tick")) {
        // Subject tick: mark the whole subject done or not
        S.done[box.dataset.k] = box.checked;
        card.classList.toggle("done", box.checked);

      } else if (box.classList.contains("ck")) {
        // Checklist item: save it, then auto-tick the subject if every
        // item is ticked (and untick it if any item isn't)
        S.ck[box.dataset.k + ".c" + box.dataset.j] = box.checked;

        const allDone = [...card.querySelectorAll(".ck")].every((x) => x.checked);
        const subjectTick = card.querySelector(".tick");
        subjectTick.checked = allDone;
        S.done[subjectTick.dataset.k] = allDone;
        card.classList.toggle("done", allDone);
      }

      if (count(cur) === DAYS[cur].tasks.length) {
        confetti();
      }

      save();
      progress();
    };

    // Typing in an answer box: save as they type
    $("tasks").oninput = (e) => {
      if (e.target.dataset.a) {
        S.ans[e.target.dataset.a] = e.target.value;
        save();
      }
    };

    /* ---------- DOWNLOAD: builds a text file of today's answers ---------- */
    $("dl").onclick = () => {
      confetti();
      const day = DAYS[cur];

      // Heading, then one block per subject: [x] ticked or [ ] not,
      // its checklist items, then each answer box with its label.
      const text =
        `Work from ${S.name || "me"}: ${day.n}\n\n` +
        day.tasks.map((t, si) => {
          const k = key(cur, si);
          return (
            `[${S.done[k] ? "x" : " "}] ${SUB[t.s]}: ${t.h}\n` +
            (t.ck || []).map((item, j) => `   [${S.ck[k + ".c" + j] ? "x" : " "}] ${item}\n`).join("") +
            (t.bx || []).map((box, j) => `\n${box[0]}:\n${(S.ans[k + ".b" + j] || "(blank)").trim()}\n`).join("")
          );
        }).join("\n---\n\n");

      // Turn the text into a file and trigger the download.
      // File name looks like "maya-wed-work.txt".
      const link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
      link.download =
        (S.name || "my").replace(/\W+/g, "-").toLowerCase() + "-" + day.d.toLowerCase() + "-work.txt";
      link.click();
    };

    // Start on the latest unlocked day (so Wednesday opens on Wednesday)
    for (let i = 0; i < DAYS.length; i++) if (isUnlocked(i)) cur = i;

    // confetti once everything is ticked! 
    function confetti() {
    // skip it for anyone who's turned animations off
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    const c = document.createElement("canvas");
    c.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:999";
    c.width = innerWidth;
    c.height = innerHeight;
    document.body.appendChild(c);

    const g = c.getContext("2d");
    const colours = ["#ff6fa8", "#3f7cff", "#19c28a", "#f5a623", "#8a5cf6", "#ffe14d"];

    // 150 pieces, starting above the top of the screen
    const bits = Array.from({ length: 150 }, () => ({
      x: Math.random() * c.width,
      y: -20 - Math.random() * c.height * 0.5,
      w: 6 + Math.random() * 6,
      h: 10 + Math.random() * 8,
      vx: -1 + Math.random() * 2,        // sideways drift
      vy: 2 + Math.random() * 3,         // fall speed
      r: Math.random() * 6.28,
      vr: -0.15 + Math.random() * 0.3,   // spin
      col: colours[Math.floor(Math.random() * colours.length)]
    }));

    (function tick() {
      g.clearRect(0, 0, c.width, c.height);
      let alive = false;
      bits.forEach((b) => {
        b.x += b.vx; b.y += b.vy; b.r += b.vr;
        if (b.y < c.height + 20) alive = true;
        g.save();
        g.translate(b.x, b.y);
        g.rotate(b.r);
        g.fillStyle = b.col;
        g.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
        g.restore();
      });
      alive ? requestAnimationFrame(tick) : c.remove();   // cleans itself up
    })();
  }

    // Draw the page for the first time
    render();
  </script>
</body>
</html>
