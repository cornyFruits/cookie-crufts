<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billionaire BBQ | KS</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body class="scrollable-page">

  <nav id="navbar">
    <a href="index.html" class="nav-brand">Krittika Sharma</a>
    <button class="hamburger" id="hamburger">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links">
      <a href="index.html" class="misc-link">BACK</a>
    </div>
  </nav>

  <main>
    <div class="about-page">
      <h1 class="about-heading">BILLIONAIRE BBQ</h1>
      <h1 class="section-label">Want to roast some kebabbed billionaires? Come back soon!</h1>
      <br>
      <h2>LOADING...</h2>

      <div class="bbq-faces-container">
      <img class="bbq-faces" src="../images/bbq/bbq-deff-lamos.png" alt="deff lamos">
      <img class="bbq-faces" src="../images/bbq/bbq-fark-suckerjurg.png" alt="fark suckerjurg">
      <img class="bbq-faces" src="../images/bbq/bbq-felon-busk.png" alt="felon busk">
      <img class="bbq-faces" src="../images/bbq/bbq-garles-coch.png" alt="gnarles coch">
      <img class="bbq-faces" src="../images/bbq/bbq-kill-mates.png" alt="kill mates">
      <img class="bbq-faces" src="../images/bbq/bbq-poopert-kurdom.png" alt="poopert kurdom">
      <img class="bbq-faces" src="../images/bbq/bbq-ronald-mumps.png" alt="ronald mumps">
      <img class="bbq-faces" src="../images/bbq/bbq-larry-meddlesome.png" alt="larry meddlesome">
      <img class="bbq-faces" src="../images/bbq/bbq-ham-faultsman.png" alt="ham faultsman">
      <img class="bbq-faces" src="../images/bbq/bbq-leema-blackhart.png" alt="leema blackhart">
      <img class="bbq-faces" src="../images/bbq/bbq-kitchard-sacked.png" alt="kitchard sacked">
      <img class="bbq-faces" src="../images/bbq/bbq-bernard-arnault.png" alt="bernard arnault">
      </div>
    </div>

    <footer class="site-footer">
      Designed &amp; built by Krittika Sharma
    </footer>
  </main>

  <script type="module">
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.querySelector('.nav-links');
    if (hamburger) {
      hamburger.addEventListener('click', (e) => {
        e.stopPropagation();
        navLinks.classList.toggle('active');
      });
    }
    navLinks.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => navLinks.classList.remove('active'));
    });
    window.openReadme = () => { window.location.href = "/"; };
  </script>
</body>
</html>
