<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billionaire BBQ | KS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="bbq.css">
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Mono&display=swap" rel="stylesheet">
</head>
<body class="scrollable-page">

  <nav id="navbar">
    <a href="index.html" class="nav-brand">Krittika Sharma</a>
    <button class="hamburger" id="hamburger">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links">
      <a href="index.html" class="misc-link">BACK</a>
    </div>
  </nav>

  <main>
    <div class="bbq-page">   
      <div class="hero-container">
        <div class="hero-carousel">
          
          <!-- Text on the Right -->
          <div class="hero-text-container">
            <h1 class="hero-text">BILLIONAIRE BBQ</h1>
            <p class="hero-small-text">Roast a billionaire today.</p>
          </div>

          <!-- Image on the Left -->
          <img class="hero-image" src="images/bbq/bbqed-felon-busk.png" alt="Felon Busk BBQed">
        </div>
      </div>

      <!-- How It Works Section: Text lives directly in HTML -->
      <div class="how-works-container">
        <div class="how-works-card">
          <div class="how-works-image">1</div>
          <div class="how-works-text">
            <h3>Pick your billionaire</h3>
          </div>
        </div>

        <div class="how-works-card">
          <div class="how-works-image">2</div>
          <div class="how-works-text">
            <h3>Pick your meat</h3>
          </div>
        </div>

        <div class="how-works-card">
          <div class="how-works-image">3</div>
          <div class="how-works-text">
            <h3>Roast your kebab</h3>
          </div>
        </div>

        <div class="how-works-card">
          <div class="how-works-image">4</div>
          <div class="how-works-text">
            <h3>Choose your condiment</h3>
          </div>
        </div>
      </div>

      <button class="get-started">GET STARTED</button>
      <div class="bbq-bill-selection hidden"></div>
    </div>

    <footer class="site-footer">
      Designed &amp; built by Krittika Sharma
    </footer>
  </main>

  <script type="module">
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.querySelector('.nav-links');
    if (hamburger) {
      hamburger.addEventListener('click', (e) => {
        e.stopPropagation();
        navLinks.classList.toggle('active');
      });
    }
    navLinks.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => navLinks.classList.remove('active'));
    });
    window.openReadme = () => { window.location.href = "/"; };
  </script>
  <script src="bbq.js"></script>
</body>
</html>
